services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://db:3306/starrail_hearing?serverTimezone=UTC&characterEncoding=UTF-8
      DB_USERNAME: "${DB_USERNAME:-oracle_app}"
      DB_PASSWORD: "${DB_PASSWORD:-change-this-password}"
      DB_POOL_MAXIMUM_SIZE: "${DB_POOL_MAXIMUM_SIZE:-10}"
      DB_POOL_MINIMUM_IDLE: "${DB_POOL_MINIMUM_IDLE:-2}"
      DB_POOL_CONNECTION_TIMEOUT_MS: "${DB_POOL_CONNECTION_TIMEOUT_MS:-3000}"
      DB_QUERY_TIMEOUT_MS: "${DB_QUERY_TIMEOUT_MS:-10000}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      APP_ADMIN_SUBJECT: "${APP_ADMIN_SUBJECT}"
      NICKNAME_CHANGE_COOLDOWN: "${NICKNAME_CHANGE_COOLDOWN:-30d}"
      TIER_AGGREGATION_INTERVAL: "${TIER_AGGREGATION_INTERVAL:-3m}"
      PROFILE_SYNC_COOLDOWN: "${PROFILE_SYNC_COOLDOWN:-3m}"
      PROFILE_CACHE_TTL: "${PROFILE_CACHE_TTL:-20s}"
      PROFILE_CIRCUIT_FAILURE_THRESHOLD: "${PROFILE_CIRCUIT_FAILURE_THRESHOLD:-3}"
      PROFILE_CIRCUIT_OPEN_DURATION: "${PROFILE_CIRCUIT_OPEN_DURATION:-30s}"
      MIHOMO_USER_AGENT: "${MIHOMO_USER_AGENT:-StarrailHearing/0.1}"
      ENKA_USER_AGENT: "${ENKA_USER_AGENT:-StarrailHearing/0.1 contact=local-development}"
      ENKA_CONNECT_TIMEOUT: "${ENKA_CONNECT_TIMEOUT:-3s}"
      ENKA_READ_TIMEOUT: "${ENKA_READ_TIMEOUT:-15s}"
      ENKA_CACHE_DEFAULT_TTL: "${ENKA_CACHE_DEFAULT_TTL:-60s}"
      ENKA_CACHE_MAXIMUM_TTL: "${ENKA_CACHE_MAXIMUM_TTL:-24h}"
      ENKA_CACHE_MAX_ENTRIES: "${ENKA_CACHE_MAX_ENTRIES:-5000}"
      ENKA_MAX_REQUESTS_PER_SECOND: "${ENKA_MAX_REQUESTS_PER_SECOND:-2}"
      ENKA_MAX_CONCURRENT_REQUESTS: "${ENKA_MAX_CONCURRENT_REQUESTS:-8}"
      ENKA_MAX_WAITING_REQUESTS: "${ENKA_MAX_WAITING_REQUESTS:-30}"
      ENKA_REQUEST_WAIT_TIMEOUT: "${ENKA_REQUEST_WAIT_TIMEOUT:-15s}"
      ENKA_BACKOFF_ON_429: "${ENKA_BACKOFF_ON_429:-30s}"
      TITLE_PRIVATE_UPLOAD_DIR: /app/private-uploads/title-verification
      TITLE_MAXIMUM_BYTES: "${TITLE_MAXIMUM_BYTES:-2097152}"
      TITLE_MAXIMUM_REQUEST_BYTES: "${TITLE_MAXIMUM_REQUEST_BYTES:-3145728}"
      TITLE_MAXIMUM_DIMENSION: "${TITLE_MAXIMUM_DIMENSION:-3200}"
      TITLE_PENDING_TTL: "${TITLE_PENDING_TTL:-30d}"
      SESSION_TIMEOUT: "${SESSION_TIMEOUT:-30m}"
      SERVER_CONNECTION_TIMEOUT: "${SERVER_CONNECTION_TIMEOUT:-5s}"
      SERVER_MAX_CONNECTIONS: "${SERVER_MAX_CONNECTIONS:-500}"
      SERVER_ACCEPT_COUNT: "${SERVER_ACCEPT_COUNT:-100}"
      SERVER_MAX_THREADS: "${SERVER_MAX_THREADS:-100}"
      SPRING_THYMELEAF_CACHE: "${SPRING_THYMELEAF_CACHE:-false}"
      SERVER_FORWARD_HEADERS_STRATEGY: "${SERVER_FORWARD_HEADERS_STRATEGY:-none}"
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "${SERVER_SERVLET_SESSION_COOKIE_SECURE:-false}"
    ports:
      - "8080:8080"
    volumes:
      - title-uploads:/app/private-uploads/title-verification
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: starrail_hearing
      MYSQL_USER: "${DB_USERNAME:-oracle_app}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-change-this-password}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-change-root-password}"
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
  title-uploads:
