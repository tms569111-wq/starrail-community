<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title th:text="${title}">붕스청문회</title>
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://raw.githubusercontent.com">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/comment-ux.css}">
    <script defer th:src="@{/js/app.js}"></script>
</head>
<body>
<header class="site-header" th:fragment="header">
    <div class="site-header__inner">
        <a class="brand" th:href="@{/}">
            <span class="brand__mark">✦</span>
            <span>붕스청문회</span>
        </a>
        <nav class="site-nav" aria-label="주 메뉴">
            <a th:href="@{/}">캐릭터</a>
            <th:block th:if="${currentUser != null}">
                <a th:if="${currentUser.admin}" th:href="@{/admin}">운영</a>
                <a class="button button--secondary button--small uid-nav-link" th:href="@{/me/profile}">UID 인증</a>
                <a th:href="@{/me/account#title-verification}">칭호 신청</a>
                <a class="status-chip" th:if="${!currentUser.nicknameConfigured}" th:href="@{/me/account}">닉네임 설정 필요</a>
                <a class="status-chip status-chip--blocked" th:if="${currentUser.nicknameConfigured and !currentUser.canWrite}" th:href="@{/me/account}">차단됨</a>
                <a class="profile-link" th:href="@{/me/account}">
                    <span th:text="${currentUser.nickname}">사용자</span>
                    <span class="platinum-badge" th:if="${currentUser.badge != null}"
                          th:style="|--badge-color:${currentUser.badge.colorHex}|"
                          th:text="${currentUser.badge.label}">PLATINUM</span>
                </a>
                <form class="header-logout" method="post" th:action="@{/logout}">
                    <button type="submit">로그아웃</button>
                </form>
            </th:block>
            <a class="button button--primary button--small" th:if="${currentUser == null}" th:href="@{/login}">Google 로그인</a>
        </nav>
    </div>
</header>
<footer class="site-footer" th:fragment="footer">
    <p>붕스청문회는 비공식 팬 프로젝트입니다. 투표 결과는 참여자 의견이며 공식 평가가 아닙니다.</p>
    <nav class="site-footer__links" aria-label="서비스 안내">
        <a th:href="@{/privacy}">개인정보처리방침</a>
        <a th:href="@{/terms}">이용 안내</a>
    </nav>
    <dialog class="notification-dialog" th:if="${notifications != null and !notifications.isEmpty()}"
            data-notification-dialog aria-labelledby="notification-dialog-title">
        <div class="notification-dialog__heading">
            <span class="eyebrow">OPERATION NOTICE</span>
            <h2 id="notification-dialog-title">운영 처리 알림</h2>
            <p>확인하지 않은 운영 처리 결과입니다.</p>
        </div>
        <div class="notification-dialog__list">
            <article class="notification-card" th:each="notification : ${notifications}">
                <strong th:text="${notification.title}">알림 제목</strong>
                <p th:text="${notification.message}">알림 내용</p>
                <time th:text="${notification.createdAt}">처리 일시</time>
            </article>
        </div>
        <form method="post" th:action="@{/me/notifications/read}">
            <input th:each="notification : ${notifications}" type="hidden"
                   name="notificationIds" th:value="${notification.id}">
            <input type="hidden" name="returnTo" th:value="${currentRequestPath}">
            <button class="button button--primary button--full" type="submit">확인했습니다</button>
        </form>
    </dialog>
</footer>
</body>
</html>
