spring:
  application:
    name: starrail-hearing
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/starrail_hearing?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:oracle_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:3000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT:1000}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:local-client-id-not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-client-secret-not-configured}
            scope: openid,profile,email
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 700KB
      max-request-size: 1MB
  data:
    redis:
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${REDIS_READ_TIMEOUT:1s}
  http:
    clients:
      connect-timeout: 3s
      read-timeout: 8s
  thymeleaf:
    cache: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
  error:
    whitelabel:
      enabled: false

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  operator:
    subject: ${APP_ADMIN_SUBJECT:}
    platinum-version: ${APP_PLATINUM_VERSION:4.4}
    platinum-label: ${APP_PLATINUM_LABEL:이상중재 PLATINUM}
    platinum-color: ${APP_PLATINUM_COLOR:#8de9ff}
  account:
    nickname-cooldown: ${NICKNAME_CHANGE_COOLDOWN:30d}
  aggregation:
    interval: ${TIER_AGGREGATION_INTERVAL:3m}
  title-verification:
    private-upload-dir: ${TITLE_PRIVATE_UPLOAD_DIR:./private-uploads/title-verification}
    maximum-bytes: ${TITLE_MAXIMUM_BYTES:716800}
    maximum-dimension: ${TITLE_MAXIMUM_DIMENSION:1600}
    pending-ttl: ${TITLE_PENDING_TTL:30d}
  mihomo:
    base-url: ${MIHOMO_BASE_URL:https://api.mihomo.me}
    user-agent: ${MIHOMO_USER_AGENT:StarrailHearing/0.1 contact=local-development}
    sync-cooldown: ${PROFILE_SYNC_COOLDOWN:3m}
    challenge-ttl: ${PROFILE_CHALLENGE_TTL:10m}
    resource-base-url: ${STAR_RAIL_RESOURCE_BASE_URL:https://raw.githubusercontent.com/Mar-7th/StarRailRes/master/}
  enka:
    base-url: ${ENKA_BASE_URL:https://enka.network}
    user-agent: ${ENKA_USER_AGENT:StarrailHearing/0.1 contact=local-development}
  profile-client:
    cache-ttl: ${PROFILE_CACHE_TTL:20s}
    maximum-cache-ttl: ${PROFILE_CACHE_MAX_TTL:24h}
    maximum-cache-entries: ${PROFILE_CACHE_MAX_ENTRIES:1000}
    redis-cache-enabled: ${PROFILE_REDIS_CACHE_ENABLED:false}
    maximum-concurrent-requests: ${PROFILE_MAX_CONCURRENT_REQUESTS:4}
    bulkhead-wait: ${PROFILE_BULKHEAD_WAIT:250ms}
    provider-minimum-interval: ${PROFILE_PROVIDER_MIN_INTERVAL:1s}
    provider-rate-wait: ${PROFILE_PROVIDER_RATE_WAIT:4s}
    circuit-failure-threshold: ${PROFILE_CIRCUIT_FAILURE_THRESHOLD:3}
    circuit-open-duration: ${PROFILE_CIRCUIT_OPEN_DURATION:30s}
