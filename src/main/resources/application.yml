spring:
  application:
    name: starrail-hearing
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/starrail_hearing?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:oracle_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAXIMUM_SIZE:10}
      minimum-idle: ${DB_POOL_MINIMUM_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: 1000
      idle-timeout: 600000
      max-lifetime: 1800000
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:local-client-id-not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-client-secret-not-configured}
            scope: openid,profile,email
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
      jakarta:
        persistence:
          query:
            timeout: ${DB_QUERY_TIMEOUT_MS:10000}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${TITLE_MAXIMUM_BYTES:2097152}
      max-request-size: ${TITLE_MAXIMUM_REQUEST_BYTES:3145728}
  http:
    clients:
      connect-timeout: 3s
      read-timeout: 8s
  thymeleaf:
    cache: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        same-site: lax
  error:
    whitelabel:
      enabled: false
  tomcat:
    connection-timeout: ${SERVER_CONNECTION_TIMEOUT:5s}
    max-connections: ${SERVER_MAX_CONNECTIONS:500}
    accept-count: ${SERVER_ACCEPT_COUNT:100}
    threads:
      max: ${SERVER_MAX_THREADS:100}
      min-spare: 10

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  site:
    contact-email: ${SITE_CONTACT_EMAIL:}
  operator:
    subject: ${APP_ADMIN_SUBJECT:}
    platinum-version: ${APP_PLATINUM_VERSION:4.5}
    platinum-label: ${APP_PLATINUM_LABEL:이상중재 PLATINUM}
    platinum-color: ${APP_PLATINUM_COLOR:#8de9ff}
  account:
    nickname-cooldown: ${NICKNAME_CHANGE_COOLDOWN:30d}
  aggregation:
    interval: ${TIER_AGGREGATION_INTERVAL:3m}
  title-verification:
    private-upload-dir: ${TITLE_PRIVATE_UPLOAD_DIR:./private-uploads/title-verification}
    maximum-bytes: ${TITLE_MAXIMUM_BYTES:2097152}
    maximum-dimension: ${TITLE_MAXIMUM_DIMENSION:3200}
    pending-ttl: ${TITLE_PENDING_TTL:30d}
  mihomo:
    base-url: ${MIHOMO_BASE_URL:https://api.mihomo.me}
    user-agent: ${MIHOMO_USER_AGENT:StarrailHearing/0.1 contact=local-development}
    sync-cooldown: ${PROFILE_SYNC_COOLDOWN:3m}
    challenge-ttl: ${PROFILE_CHALLENGE_TTL:10m}
    resource-base-url: ${STAR_RAIL_RESOURCE_BASE_URL:https://raw.githubusercontent.com/Mar-7th/StarRailRes/master/}
  enka:
    base-url: ${ENKA_BASE_URL:https://enka.network}
    user-agent: ${ENKA_USER_AGENT:StarrailHearing/0.1 contact=local-development}
    # 네트워크 제한도 운영 환경변수로 바꿀 수 있습니다.
    connect-timeout: ${ENKA_CONNECT_TIMEOUT:3s}
    read-timeout: ${ENKA_READ_TIMEOUT:15s}
    # Enka가 ttl을 누락했을 때만 쓰는 안전 기본값입니다. 실제 ttl이 있으면 그 값을 우선합니다.
    cache-default-ttl: ${ENKA_CACHE_DEFAULT_TTL:60s}
    # 비정상적으로 큰 ttl 때문에 오래된 데이터가 계속 남거나 시간 계산이 넘치는 것을 막습니다.
    cache-maximum-ttl: ${ENKA_CACHE_MAXIMUM_TTL:24h}
    cache-max-entries: ${ENKA_CACHE_MAX_ENTRIES:5000}
    # 단일 Spring 인스턴스 전체에서 Enka 요청 시작 속도를 제한합니다.
    max-requests-per-second: ${ENKA_MAX_REQUESTS_PER_SECOND:2}
    # 실제 Enka HTTP 요청이 동시에 진행될 수 있는 최대 개수입니다.
    max-concurrent-requests: ${ENKA_MAX_CONCURRENT_REQUESTS:8}
    # 위 동시 처리 슬롯 밖에서 짧게 기다릴 수 있는 요청 수입니다.
    max-waiting-requests: ${ENKA_MAX_WAITING_REQUESTS:30}
    # rate-limit/동시 처리 슬롯을 기다릴 최대 시간입니다. 초과하면 사용자에게 재시도를 안내합니다.
    request-wait-timeout: ${ENKA_REQUEST_WAIT_TIMEOUT:15s}
    # Enka가 HTTP 429를 주면 이 시간 이상 전체 Enka 요청을 쉬고 MiHoMo fallback을 사용합니다.
    backoff-on-429: ${ENKA_BACKOFF_ON_429:30s}
  profile-client:
    cache-ttl: ${PROFILE_CACHE_TTL:20s}
    circuit-failure-threshold: ${PROFILE_CIRCUIT_FAILURE_THRESHOLD:3}
    circuit-open-duration: ${PROFILE_CIRCUIT_OPEN_DURATION:30s}
